<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Blocked by Ad Interceptor</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; --bg: #f6f4fa; --card: #fff; --text: #1d1726; --muted: #6b6478; --accent: #9b3bff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #16121d; --card: #221c2c; --text: #f4f1f8; --muted: #a89fb5; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px; }
  .card { max-width: 440px; background: var(--card); border-radius: 16px; padding: 28px; box-shadow: 0 10px 40px rgba(0,0,0,.12); text-align: center; }
  .shield { width: 52px; height: 52px; margin: 0 auto 14px; border-radius: 14px; background: var(--accent); display: grid; place-items: center; }
  h1 { font-size: 19px; margin: 0 0 6px; }
  p { margin: 0 0 18px; color: var(--muted); }
  .row { display: flex; gap: 10px; justify-content: center; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 9px; padding: 9px 16px; cursor: pointer; }
  .primary { background: var(--accent); color: #fff; }
  .ghost { background: transparent; color: var(--text); border: 1px solid rgba(127,127,127,.35); }
</style>
</head>
<body>
  <main class="card">
    <div class="shield" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 5 6v6c0 4 3 7 7 9 4-2 7-5 7-9V6z"/><path d="m9 12 2 2 4-4"/></svg>
    </div>
    <h1>Ad page blocked</h1>
    <p id="why">Ad Interceptor stopped this tab from opening an ad or pop-up page.</p>
    <div class="row">
      <button class="primary" id="close" type="button">Close tab</button>
      <button class="ghost" id="back" type="button">Go back</button>
    </div>
  </main>
  <script src="blocked.js"></script>
</body>
</html>
